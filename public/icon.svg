
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="stars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Decorative dots top-right -->
  <circle cx="420" cy="80" r="12" fill="white" opacity="0.15"/>
  <circle cx="455" cy="55" r="8" fill="white" opacity="0.10"/>
  <circle cx="390" cy="50" r="6" fill="white" opacity="0.10"/>

  <!-- Speech bubble body -->
  <path d="M 100 150
           Q 100 105 145 105
           L 367 105
           Q 412 105 412 150
           L 412 290
           Q 412 335 367 335
           L 210 335
           L 155 400
           L 168 335
           Q 100 335 100 290
           Z"
        fill="white" opacity="0.97"/>

  <!-- EN text inside bubble -->
  <text
    x="256" y="252"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="148"
    letter-spacing="-4"
    fill="url(#bg)">EN</text>

  <!-- Small star accent bottom-left -->
  <text x="72" y="440" font-size="52" font-family="Arial">🌟</text>
</svg>
